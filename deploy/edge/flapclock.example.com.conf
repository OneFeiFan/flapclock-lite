# 翻牌钟简化版 · 边缘网关 vhost（模板）
#
# 这份文件在仓库里是**模板**：域名一律写成 flapclock.example.com。
# deploy.mjs 上传前会把 flapclock.example.com 全部替换成 deploy/.env 里 DOMAIN 的真实值，
# 并以 <你的域名>.conf 为名放进 /opt/edge/conf.d/ —— 真实域名不会进仓库。
#
# 安装位置：宿主机的 /opt/edge/conf.d/<你的域名>.conf
# 它被 poker-timer-web 容器以只读方式挂到 /etc/nginx/edge-conf.d/，
# 再由 poker-timer 自己的 nginx.conf 末尾那句 include 引入（见那个项目仓库的 nginx.conf 最后一节）。
#
# 为什么要有这一层：这台服务器上 80/443 由既有的边缘网关容器独占，
# 本项目自己去 publish 80/443 会直接端口冲突。所以本项目只在 docker 网络里监听 18630，
# 由这里做 TLS 终结和反向代理 —— 这也是这台服务器上接入新项目的标准做法。
#
# 改完生效：
#   docker exec poker-timer-web nginx -t && docker exec poker-timer-web nginx -s reload

server {
    listen 80;
    server_name flapclock.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name flapclock.example.com;

    # 证书必须被安卓 6 的电视盒子信任：不要用 Let's Encrypt
    # （安卓 7.1 以下不认它的根证书 ISRG Root X1，正式版 APK 会直接打不开）。
    # 现网其他站点用的是腾讯云免费 DV（TrustAsia），这里保持一致。
    ssl_certificate     /etc/nginx/edge-certs/flapclock.example.com.pem;
    ssl_certificate_key /etc/nginx/edge-certs/flapclock.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # 安卓 6 支持 TLS 1.2
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 应用自己限制请求体 512kb，这里留一点余量
    client_max_body_size 2m;

    # 实时通道：大屏和手机都会长期保持连接。路径是 /ws（没有尾斜杠，
    # 和 poker-timer 的 /ws/ 不一样，别抄错）。
    location /ws {
        proxy_pass http://flapclock-app:18630;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 连接空转被掐断会让大屏反复重连、多屏同步看起来“时好时坏”
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余全部交给应用：/ 遥控页、/tv/ 大屏页、/api/... 接口都在同一个进程里，
    # 页面用的是根路径（前端构建没有设 base），所以不能挂在子目录下。
    location / {
        proxy_pass http://flapclock-app:18630;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # 访问控制（当前不需要登录：任何能打开域名的人都能控制比赛和屏幕）。
    # 哪天要收紧，在这个 server 块里加两行即可，应用代码一行都不用动：
    #
    #     allow 203.0.113.10;   # 门店出口 IP
    #     deny  all;
    #
    # 注意电视盒子也必须从同一个 IP 出去，否则大屏会被一起挡掉；
    # 手机用 4G/5G 打开遥控页时走的是运营商 IP，也会被挡，这是取舍。
    # ---------------------------------------------------------------
}
